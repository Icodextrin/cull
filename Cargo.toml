[package]
name = "cull"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
fast_image_resize = "6.1.0"
glyphon = "0.12.0"
kamadak-exif = "0.6.1"
pollster = "1.0.1"
